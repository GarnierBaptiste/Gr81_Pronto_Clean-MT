<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #f3f1ea;
      color: #2a3442;
    }

    .card {
      width: min(420px, calc(100% - 32px));
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid #d6d1c6;
      border-radius: 12px;
      padding: 20px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 1.3rem;
    }

    form {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 0.95rem;
    }

    input {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #bdb8ad;
      background: #ffffff;
      color: inherit;
      outline: none;
    }

    input:focus {
      border-color: #2f4a6b;
    }

    button {
      margin-top: 4px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #2f4a6b;
      background: #2f4a6b;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #2f4a6b;
      background: #2f4a6b;
      color: white;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      font: inherit;
      line-height: 1;
    }

    .navLink {
      color: inherit;
      text-decoration: none;
    }

    .backBtn {
      position: fixed;
      top: 16px;
      left: 16px;
      margin-top: 0;
      z-index: 10;
    }

    .statusMessage {
      border-radius: 10px;
      border: 1px solid #d6d1c6;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.8);
      font-size: 0.95rem;
    }

    .statusMessage.error {
      border-color: rgba(138, 31, 43, 0.35);
      color: #8a1f2b;
    }

    .statusMessage.success {
      border-color: rgba(27, 107, 74, 0.35);
      color: #1b6b4a;
    }
  </style>
</head>
<body>
  <a class="btn backBtn" href="connexion.html">Retour à la page de connexion</a>

  <div class="card">
    <h1>Créer un compte</h1>
    <form id="signupForm">
      <label>
        Mail
        <input type="email" name="mail" autocomplete="email" required />
      </label>

      <label>
        Mot de passe
        <input type="password" name="password" autocomplete="new-password" required />
      </label>

      <label>
        Confirmation du mot de passe
        <input type="password" name="passwordConfirm" autocomplete="new-password" required />
      </label>

      <div id="statusMessage" class="statusMessage" style="display: none"></div>

      <button type="submit">S'inscrire</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('signupForm');

    function csvEscape(value) {
      const s = String(value ?? '');
      if (s.includes('"')) return '"' + s.replaceAll('"', '""') + '"';
      if (s.includes(';') || s.includes('\n') || s.includes('\r')) return '"' + s + '"';
      return s;
    }

    async function readExistingCsv() {
      try {
        const res = await fetch('connexion.csv', { cache: 'no-store' });
        if (!res.ok) return '';
        return await res.text();
      } catch {
        return '';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const statusMessage = document.getElementById('statusMessage');
      const submitBtn = form.querySelector('button[type="submit"]');
      const setStatus = (text, kind) => {
        statusMessage.textContent = text;
        statusMessage.classList.remove('error', 'success');
        if (kind) statusMessage.classList.add(kind);
        statusMessage.style.display = text ? 'block' : 'none';
      };

      const mail = form.elements.mail.value.trim();
      const password = form.elements.password.value;
      const passwordConfirm = form.elements.passwordConfirm.value;

      if (password !== passwordConfirm) {
        setStatus('Les mots de passe ne sont pas identiques.', 'error');
        return;
      }

      setStatus('', null);
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/inscription', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mail, password })
        });

        if (res.status === 409) {
          setStatus('Ce mail est déjà inscrit.', 'error');
          return;
        }

        if (!res.ok) {
          setStatus("Erreur lors de l'inscription.", 'error');
          return;
        }

        setStatus("Inscription réussie. Redirection...", 'success');
        window.location.href = 'connexion.html';
      } catch {
        setStatus("Erreur: impossible de contacter le serveur. Lance server.py puis réessaie.", 'error');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
