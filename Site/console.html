<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Console MicroPython</title>
  <style>
    :root {
      --paper: #f3f1ea;
      --ink: #2a3442;
      --navy: #2f4a6b;
      --border: #d6d1c6;
      --card: rgba(255, 255, 255, 0.78);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      width: min(900px, calc(100% - 32px));
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.2rem;
      margin: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--navy);
      background: var(--navy);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      line-height: 1;
      font: inherit;
      cursor: pointer;
    }

    .btnSecondary {
      background: transparent;
      color: var(--navy);
    }

    .console {
      height: min(70vh, 520px);
      overflow: auto;
      background: #0f172a;
      color: #e5e7eb;
      border-radius: 12px;
      border: 1px solid rgba(15, 23, 42, 0.25);
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .status {
      margin: 0 0 10px;
      font-size: 0.95rem;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="header">
        <h1>Console MicroPython</h1>
        <div style="display:flex; gap:10px; flex-wrap:wrap">
          <a class="btn btnSecondary" href="index.html">Accueil</a>
          <button id="clearBtn" class="btn btnSecondary" type="button">Effacer</button>
        </div>
      </div>

      <p id="status" class="status">En attente de données...</p>
      <div id="console" class="console"></div>
    </div>
  </div>

  <script>
    const consoleEl = document.getElementById('console');
    const statusEl = document.getElementById('status');
    const clearBtn = document.getElementById('clearBtn');

    let lastCount = 0;

    function scrollToBottom() {
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    clearBtn.addEventListener('click', () => {
      consoleEl.textContent = '';
      lastCount = 0;
      statusEl.textContent = 'Console effacée.';
    });

    async function pollLogs() {
      try {
        const res = await fetch('/api/accel/logs', { cache: 'no-store' });
        if (!res.ok) throw new Error('fetch failed');
        const data = await res.json();
        const logs = Array.isArray(data.logs) ? data.logs : [];

        statusEl.textContent = `Messages reçus: ${logs.length}`;

        if (logs.length !== lastCount) {
          consoleEl.textContent = logs.join('\n');
          lastCount = logs.length;
          scrollToBottom();
        }
      } catch {
        statusEl.textContent = 'Impossible de contacter le serveur. Lance server.py.';
      }
    }

    pollLogs();
    setInterval(pollLogs, 500);
  </script>
</body>
</html>
