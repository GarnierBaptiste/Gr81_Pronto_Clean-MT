<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parc des machines</title>
  <style>
    :root {
      --paper: #f3f1ea;
      --ink: #2a3442;
      --navy: #2f4a6b;
      --border: #d6d1c6;
      --card: rgba(255, 255, 255, 0.78);
      --green: #1b6b4a;
      --red: #8a1f2b;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--navy);
      background: var(--navy);
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      font: inherit;
      line-height: 1;
    }

    .backBtn {
      position: fixed;
      top: 16px;
      left: 16px;
      margin-top: 0;
      z-index: 10;
    }

    main {
      padding: 72px 16px 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 1.6rem;
    }

    /* Disposition en U */
    .u-layout {
      display: grid;
      grid-template-areas:
        "left top-row top-row top-row top-row right"
        "left .        .        .        .       right"
        "left .        .        .        .       right";
      grid-template-columns: 150px 1fr 1fr 1fr 1fr 150px;
      gap: 12px;
    }

    .u-left {
      grid-area: left;
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: flex-start;
    }

    .u-top {
      grid-area: top-row;
      display: flex;
      flex-direction: row;
      gap: 12px;
      justify-content: flex-start;
    }

    .u-top .machine {
      flex: 1;
    }

    .u-right {
      grid-area: right;
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: flex-start;
    }

    .machine {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      display: grid;
      gap: 5px;
    }

    .machineHeader {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
    }

    .machineTitle {
      margin: 0;
      font-size: 0.85rem;
    }

    .badge {
      padding: 3px 7px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #ffffff;
      font-weight: 700;
      font-size: 0.72rem;
      white-space: nowrap;
    }

    .badge.available {
      border-color: rgba(27, 107, 74, 0.35);
      color: var(--green);
    }

    .badge.running {
      border-color: rgba(138, 31, 43, 0.35);
      color: var(--red);
    }

    .meta {
      display: grid;
      gap: 6px;
      font-size: 0.95rem;
      opacity: 0.95;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.78rem;
    }
  </style>
</head>
<body>
  <a class="btn backBtn" href="index.html">Retour</a>

  <main>
    <h1>Parc des machines</h1>
    <div class="u-layout" id="machinesLayout">
      <div class="u-left" id="leftCol"></div>
      <div class="u-top" id="topRow"></div>
      <div class="u-right" id="rightCol"></div>
    </div>
  </main>

  <script>
    const RENDER_URL = 'https://gr81-pronto-clean-mt.onrender.com';
    const COUNTDOWN_MS = 47 * 60 * 1000;

    const leftCol  = document.getElementById('leftCol');
    const topRow   = document.getElementById('topRow');
    const rightCol = document.getElementById('rightCol');

    // Machines par zone selon la photo (U)
    const LEFT_MACHINES  = [11, 10, 29];          // bras gauche, de haut en bas
    const TOP_MACHINES   = [12, 13, 14, 15];      // barre du haut, gauche → droite
    const RIGHT_MACHINES = [16, 17, 18, 19, 20];  // bras droit, de haut en bas

    function createMachineCard(num) {
      const id = String(num).padStart(2, '0');
      const card = document.createElement('article');
      card.className = 'machine';
      card.dataset.machine = id;
      card.innerHTML = `
        <div class="machineHeader">
          <h2 class="machineTitle">M${num}</h2>
          <span class="badge available" data-role="status">Disponible</span>
        </div>
        <div class="meta">
          <div><span class="mono" data-role="timer">00:00:00</span></div>
        </div>
      `;
      return card;
    }

    LEFT_MACHINES.forEach(n  => leftCol.appendChild(createMachineCard(n)));
    TOP_MACHINES.forEach(n   => topRow.appendChild(createMachineCard(n)));
    RIGHT_MACHINES.forEach(n => rightCol.appendChild(createMachineCard(n)));

    // Machine 1 = machine 29 (première du bras gauche) pour le capteur physique
    const machine1  = leftCol.querySelector('[data-machine="29"]');
    const statusEl  = machine1.querySelector('[data-role="status"]');
    const timerEl   = machine1.querySelector('[data-role="timer"]');

    let runningSinceMs    = null;
    let neutralStreak     = 0;
    let lastSeenTimestamp = null;
    let lastOverride      = null;   // dernier état reçu depuis /api/machine1/state

    function formatDuration(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const h = String(Math.floor(total / 3600)).padStart(2, '0');
      const m = String(Math.floor((total % 3600) / 60)).padStart(2, '0');
      const s = String(total % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function setAvailable() {
      statusEl.textContent = 'Disponible';
      statusEl.classList.remove('running');
      statusEl.classList.add('available');
      runningSinceMs = null;
      timerEl.textContent = '00:00:00';
    }

    function setRunning(sinceMs) {
      statusEl.textContent = 'En route';
      statusEl.classList.remove('available');
      statusEl.classList.add('running');
      if (runningSinceMs === null) {
        runningSinceMs = sinceMs ?? Date.now();
      }
    }

    // ── Poll /api/machine1/state (override admin) ──────────────────────────
    async function pollAdminState() {
      try {
        const res = await fetch(`${RENDER_URL}/api/machine1/state`, { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        const override = data.override;

        if (override === lastOverride) return;
        lastOverride = override;

        if (override === 'running' && runningSinceMs === null) {
          setRunning(Date.now());
        } else if (override === 'reset') {
          neutralStreak = 0;
          setAvailable();
        }
      } catch { }
    }

    // ── Poll donnee.csv (capteur physique) ────────────────────────────────
    function parseTimestampToMs(ts) {
      const s = String(ts ?? '').trim();
      if (!s) return null;
      const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})T(\d{1,2}):(\d{2}):(\d{2})(?:\.(\d{1,3}))?$/);
      if (!m) { const ms = Date.parse(s); return Number.isFinite(ms) ? ms : null; }
      const day = Number(m[2]), month = Number(m[3]);
      if (month < 1 || month > 12 || day < 1 || day > 31) return null;
      const d = new Date(Number(m[1]), month - 1, day, Number(m[4]), Number(m[5]), Number(m[6]), Number((m[7] ?? '0').padEnd(3, '0')));
      const ms = d.getTime();
      return Number.isFinite(ms) ? ms : null;
    }

    function parseCsvRows(csvText) {
      const lines = String(csvText ?? '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim().split('\n').filter(l => l.trim());
      if (lines.length < 2) return null;
      const header = lines[0].split(',').map(s => s.trim());
      const tsIndex = header.indexOf('timestamp');
      const fgIndex = header.indexOf('f_g');
      if (tsIndex === -1 || fgIndex === -1) return null;
      return lines.slice(1).map(line => {
        const cols = line.split(',').map(s => s.trim());
        return { ts: cols[tsIndex] ?? '', fg: Number.parseFloat(cols[fgIndex] ?? '') };
      });
    }

    function isNeutral(fg) { return Number.isFinite(fg) && fg === 1.0; }

    function findStartAfterLastTripleNeutral(rows) {
      for (let i = rows.length - 3; i >= 0; i--) {
        if (isNeutral(rows[i].fg) && isNeutral(rows[i+1].fg) && isNeutral(rows[i+2].fg)) {
          const next = rows[i + 3];
          return next ? parseTimestampToMs(next.ts) : null;
        }
      }
      return null;
    }

    async function pollMachine1() {
      try {
        const res = await fetch(`${RENDER_URL}/donnee.csv`, { cache: 'no-store' });
        if (!res.ok) return;
        const rows = parseCsvRows(await res.text());
        if (!rows || rows.length === 0) return;

        const last = rows[rows.length - 1];
        if (lastSeenTimestamp === last.ts) return;
        lastSeenTimestamp = last.ts;

        if (runningSinceMs !== null) { setRunning(); return; }

        if (!isNeutral(last.fg)) {
          const start = findStartAfterLastTripleNeutral(rows);
          const now = Date.now();
          setRunning(start && start <= now ? start : now);
          neutralStreak = 0;
        } else {
          neutralStreak += 1;
          if (neutralStreak >= 5) setAvailable();
        }
      } catch { }
    }

    // ── Tick minuteur ─────────────────────────────────────────────────────
    setInterval(() => {
      if (runningSinceMs === null) return;
      const remaining = COUNTDOWN_MS - (Date.now() - runningSinceMs);
      if (remaining <= 0) { neutralStreak = 0; setAvailable(); return; }
      timerEl.textContent = formatDuration(remaining);
    }, 250);

    // ── Démarrage ─────────────────────────────────────────────────────────
    setAvailable();
    pollAdminState();
    pollMachine1();
    setInterval(pollAdminState, 1000);   // vérifie l'admin toutes les secondes
    setInterval(pollMachine1,   1000);
  </script>
</body>
</html>
