<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Clean'MT</title>
  <style>
    :root {
      --paper: #f3f1ea;
      --ink: #2a3442;
      --navy: #2f4a6b;
      --border: #d6d1c6;
      --card: rgba(255, 255, 255, 0.78);
      --green: #1b6b4a;
      --green-border: rgba(27, 107, 74, 0.35);
      --red: #8a1f2b;
      --red-border: rgba(138, 31, 43, 0.35);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }

    .card {
      width: min(520px, calc(100% - 32px));
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 24px;
      display: grid;
      gap: 20px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
    }

    .badge {
      padding: 5px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.82rem;
      white-space: nowrap;
      border: 1px solid var(--border);
      background: #fff;
    }

    .badge.available {
      border-color: var(--green-border);
      color: var(--green);
    }

    .badge.running {
      border-color: var(--red-border);
      color: var(--red);
    }

    /* ── Config form ── */
    .config-section {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .config-title {
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--navy);
      margin: 0 0 2px;
    }

    .field {
      display: grid;
      gap: 5px;
    }

    .field label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--ink);
    }

    .field select,
    .field input[type="number"],
    .field input[type="text"] {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      font-size: 0.95rem;
      background: #fff;
      color: var(--ink);
      width: 100%;
    }

    .field select:focus,
    .field input:focus {
      outline: 2px solid var(--navy);
      outline-offset: 1px;
    }

    .fields-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ── Machine status ── */
    .machine-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }

    .machine-label {
      font-weight: 600;
      font-size: 1rem;
    }

    .timer {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.1rem;
      color: var(--navy);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 16px;
      border-radius: 10px;
      font: inherit;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-start {
      background: var(--green);
      color: #fff;
    }

    .btn-reset {
      background: var(--red);
      color: #fff;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid var(--navy);
      background: transparent;
      color: var(--navy);
      font: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      cursor: pointer;
    }

    .feedback {
      font-size: 0.9rem;
      text-align: center;
      min-height: 1.4em;
      opacity: 0.85;
    }

    .feedback.success { color: var(--green); }
    .feedback.error   { color: var(--red); }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>Administration</h1>
      <a class="btn-back" href="index.html">← Accueil</a>
    </div>

    <!-- ── Paramètres de lancement ── -->
    <div class="config-section">
      <p class="config-title">Paramètres</p>

      <div class="fields-row">
        <div class="field">
          <label for="machineSelect">Numéro de machine</label>
          <select id="machineSelect">
            <option value="11">Machine 11</option>
            <option value="12">Machine 12</option>
            <option value="13">Machine 13</option>
            <option value="14">Machine 14</option>
            <option value="15">Machine 15</option>
            <option value="16">Machine 16</option>
            <option value="17">Machine 17</option>
            <option value="18">Machine 18</option>
            <option value="19">Machine 19</option>
            <option value="20">Machine 20</option>
            <option value="29" selected>Machine 29</option>
          </select>
        </div>

        <div class="field">
          <label for="durationInput">Durée (minutes)</label>
          <input type="number" id="durationInput" min="1" max="999" value="47" />
        </div>
      </div>

      <div class="field">
        <label for="labelInput">Texte affiché sur la machine</label>
        <input type="text" id="labelInput" maxlength="60" placeholder="ex : Lavage en cours – Jean D." />
      </div>
    </div>

    <!-- ── État en temps réel ── -->
    <div class="machine-info">
      <span id="machineLabel" class="machine-label">Machine 29</span>
      <span id="statusBadge" class="badge available">Disponible</span>
      <span id="timerDisplay" class="timer">00:00:00</span>
    </div>

    <div class="actions">
      <button id="btnStart" class="btn btn-start" onclick="handleStart()">▶ En marche</button>
      <button id="btnReset" class="btn btn-reset" onclick="handleReset()">⏹ Reset</button>
    </div>

    <p id="feedback" class="feedback"></p>
  </div>

  <script>
    //const RENDER_URL = 'https://gr81-pronto-clean-mt.onrender.com';
    const RENDER_URL = 'http://127.0.0.1:8000';
    const statusBadge   = document.getElementById('statusBadge');
    const timerDisplay  = document.getElementById('timerDisplay');
    const machineLabelEl = document.getElementById('machineLabel');
    const feedback      = document.getElementById('feedback');
    const btnStart      = document.getElementById('btnStart');
    const btnReset      = document.getElementById('btnReset');
    const machineSelect = document.getElementById('machineSelect');
    const durationInput = document.getElementById('durationInput');
    const labelInput    = document.getElementById('labelInput');

    let runningSinceMs = null;
    let timerInterval  = null;
    let countdownMs    = 47 * 60 * 1000;

    // Met à jour le label affiché quand on change la machine
    machineSelect.addEventListener('change', () => {
      machineLabelEl.textContent = `Machine ${machineSelect.value}`;
    });

    function setFeedback(msg, kind) {
      feedback.textContent = msg;
      feedback.className = 'feedback' + (kind ? ' ' + kind : '');
      if (msg) setTimeout(() => { feedback.textContent = ''; feedback.className = 'feedback'; }, 3000);
    }

    function formatDuration(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const h = String(Math.floor(total / 3600)).padStart(2, '0');
      const m = String(Math.floor((total % 3600) / 60)).padStart(2, '0');
      const s = String(total % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function startTimer() {
      runningSinceMs = Date.now();
      statusBadge.textContent = 'En route';
      statusBadge.className = 'badge running';

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const remaining = countdownMs - (Date.now() - runningSinceMs);
        if (remaining <= 0) {
          resetTimer();
          return;
        }
        timerDisplay.textContent = formatDuration(remaining);
      }, 250);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      runningSinceMs = null;
      timerDisplay.textContent = '00:00:00';
      statusBadge.textContent = 'Disponible';
      statusBadge.className = 'badge available';
    }

    async function handleStart() {
      const machineNum = machineSelect.value;
      const minutes    = parseInt(durationInput.value, 10) || 47;
      const label      = labelInput.value.trim();

      countdownMs = minutes * 60 * 1000;
      machineLabelEl.textContent = `Machine ${machineNum}`;

      btnStart.disabled = true;
      try {
        const res = await fetch(`${RENDER_URL}/api/machine/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ machine: machineNum, duration: minutes, label })
        });
        if (!res.ok) throw new Error();
        startTimer();
        setFeedback(`Machine ${machineNum} démarrée (${minutes} min).`, 'success');
      } catch {
        setFeedback('Impossible de contacter le serveur.', 'error');
      } finally {
        btnStart.disabled = false;
      }
    }

    async function handleReset() {
      const machineNum = machineSelect.value;
      btnReset.disabled = true;
      try {
        const res = await fetch(`${RENDER_URL}/api/machine/reset`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ machine: machineNum })
        });
        if (!res.ok) throw new Error();
        resetTimer();
        setFeedback(`Machine ${machineNum} réinitialisée.`, 'success');
      } catch {
        setFeedback('Impossible de contacter le serveur.', 'error');
      } finally {
        btnReset.disabled = false;
      }
    }
  </script>
</body>
</html>
